server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cache the cljs bundles aggressively — shadow-cljs release builds emit
    # content-addressable filenames (main.js, etc.) and the HTML references
    # them directly; bust by rebuilding the image.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML should always re-validate so a redeploy is picked up immediately.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Directory requests serve the directory's index.html (ball/, cube/, /).
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_types         text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied       any;
}
