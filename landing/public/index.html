<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vibe — Exercises</title>
    <style>
      :root {
        --bg-0: #07090f;
        --bg-1: #0d111a;
        --ink: #e8e8ee;
        --ink-dim: #9aa3b4;
        --accent: #ff9c5b;
        --accent-2: #6ad6ff;
        --border: rgba(255,255,255,0.08);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100%;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2238 0%, transparent 60%),
                    radial-gradient(900px 500px at 110% 10%, #3a1840 0%, transparent 55%),
                    var(--bg-0);
        color: var(--ink);
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 96px 32px 64px;
      }
      header { margin-bottom: 56px; }
      h1 {
        margin: 0 0 12px 0;
        font-size: 56px;
        letter-spacing: -0.02em;
        font-weight: 700;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      header p {
        margin: 0;
        max-width: 640px;
        font-size: 17px;
        line-height: 1.55;
        color: var(--ink-dim);
      }
      .tag {
        display: inline-block;
        padding: 4px 10px;
        margin-bottom: 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-dim);
        background: rgba(255,255,255,0.02);
      }
      #cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }
      footer {
        margin-top: 64px;
        font-size: 13px;
        color: var(--ink-dim);
      }
      footer code {
        background: rgba(255,255,255,0.06);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <span class="tag">Vibe Coding</span>
        <h1>Exercises</h1>
        <p>Small ClojureScript playgrounds built while working through
           <em>Vibe Coding</em>. Each card opens its own little app.</p>
      </header>
      <section id="cards"></section>
      <footer>
        Built with shadow-cljs. Each exercise lives in its own folder — run
        <code>npx shadow-cljs watch app</code> from inside <code>ball/</code> or
        <code>cube/</code> to start them.
      </footer>
    </main>
    <script src="/js/main.js"></script>
  </body>
</html>
